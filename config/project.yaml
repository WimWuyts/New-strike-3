# Centrale projectconfiguratie.
# Elke waarde hier is bindend voor de pipeline. Wijzig niets zonder de
# bijhorende beslissing in reports/decisions.md bij te werken.

project:
  name: "New Ace 3 / New Strike 3 leermiddelen"
  schema_version: "v1"
  interface_language: "nl"          # instructies, feedback, UI
  target_language: "en"
  english_variant: "en-GB"          # bevestigd door de gebruiker, geldt voor beide boeken
  english_variant_confirmed: true

# ---------------------------------------------------------------------------
# Boeken
# ---------------------------------------------------------------------------
books:
  - id: ace3
    title: "New Ace 3"
    edition: null                    # nog niet uit de bron bevestigd
    source_glob: "sources/books/ace3/*.pdf"
    unit_count: 8
    cefr_target: "A2+/B1"
    audience: "3e jaar, doorstroomfinaliteit"
    themes:
      - { id: ace3-u1, unit: 1, source_file: "Digiboek - New Ace 3 UNIT 1.pdf" }
      - { id: ace3-u2, unit: 2, source_file: "Digiboek - New Ace 3 UNIT 2.pdf" }
      - { id: ace3-u3, unit: 3, source_file: "Digiboek - New Ace 3 UNIT 3.pdf" }
      - { id: ace3-u4, unit: 4, source_file: "Digiboek - New Ace 3 UNIT 4.pdf" }
      - { id: ace3-u5, unit: 5, source_file: "Digiboek - New Ace 3 UNIT 5.pdf" }
      - { id: ace3-u6, unit: 6, source_file: "Digiboek - New Ace 3 UNIT 6.pdf" }
      - { id: ace3-u7, unit: 7, source_file: "Digiboek - New Ace 3 UNIT 7.pdf" }
      - { id: ace3-u8, unit: 8, source_file: "Digiboek - New Ace 3 UNIT 8.pdf" }

  - id: strike3
    title: "New Strike 3"
    edition: "2024"                  # uit de documenttitel van de bron
    source_glob: "sources/books/strike3/*.pdf"
    unit_count: 8
    cefr_target: "A2"
    audience: "3e jaar, dubbele of arbeidsmarktfinaliteit"
    themes:
      - { id: strike3-u1, unit: 1, source_file: "Digiboek - New Strike 3 UNIT 1.pdf" }
      - { id: strike3-u2, unit: 2, source_file: "Digiboek - New Strike 3 UNIT 2.pdf" }
      - { id: strike3-u3, unit: 3, source_file: "Digiboek - New Strike 3 UNIT 3.pdf" }
      - { id: strike3-u4, unit: 4, source_file: "Digiboek - New Strike 3 UNIT 4.pdf" }
      - { id: strike3-u5, unit: 5, source_file: "Digiboek - New Strike 3 UNIT 5.pdf" }
      - { id: strike3-u6, unit: 6, source_file: "Digiboek - New Strike 3 UNIT 6.pdf" }
      - { id: strike3-u7, unit: 7, source_file: "Digiboek - New Strike 3 UNIT 7.pdf" }
      # Unit 8 bestaat wel in het boek, maar is niet aangeleverd. De leerkracht
      # geraakt er in de praktijk zelden, dus lage prioriteit. Zet
      # source_available op true zodra de pdf in sources/books/strike3/ staat.
      - id: strike3-u8
        unit: 8
        source_file: "Digiboek - New Strike 3 UNIT 8.pdf"
        source_available: false
        priority: low
        note: "Bestaat, maar wordt in de praktijk zelden bereikt."

# ---------------------------------------------------------------------------
# Rechten
# ---------------------------------------------------------------------------
rights:
  status: "licensed_classroom"
  confirmation_file: "docs/rights-confirmation.md"
  confirmed: true
  use_scope: "own_lesson_groups"

  # Altijd toegestaan
  allow_inventory: true
  allow_original_companion: true

  # Bevestigd door de leerkracht, uitsluitend voor eigen lesgroepen.
  # Antwoordsleutels zijn uitgeversinhoud: ze mogen nooit in leerlingmateriaal.
  allow_source_answer_keys: true
  answer_keys_teacher_only: true

  # Blijft dicht. Dit gaat over pagina- en beeldreproductie, en dat is iets
  # anders dan het projecteren van antwoorden. Niet meebewegen met het
  # bovenstaande.
  allow_page_faithful_reproduction: false
  allow_source_image_reuse: false
  allow_raster_slide_backgrounds: false

  note: >
    De bron-pdf's dragen een gepersonaliseerd watermerk ("Wim Wuyts") en zijn
    persoonlijke licentiekopieen van commercieel uitgeversmateriaal. De
    leerkracht bevestigt gebruik binnen de eigen lesgroepen; zie
    docs/rights-confirmation.md. Verspreiding buiten die groepen valt daar
    niet onder.

# ---------------------------------------------------------------------------
# Bronextractie
# ---------------------------------------------------------------------------
extraction:
  text_layer_present: false          # vastgesteld tijdens preflight
  ocr_required: true                 # 100% van de paginas
  render_dpi: 200
  ocr_dpi: 300
  ocr_languages: ["eng", "nld"]
  ocr_min_confidence: 60             # blokken hieronder gaan naar de review queue
  watermark:
    present: true
    text: "Wim Wuyts"
    strategy: "preprocess_and_filter"
    # OCR-blokken die (fuzzy) matchen met de watermerktekst worden verwijderd.
    filter_similarity_threshold: 0.82

# ---------------------------------------------------------------------------
# Oefeningen
# ---------------------------------------------------------------------------
exercises:
  scope_unit: "topic_scope"          # 25 per grammaticaonderwerp en per woordenschatset
  per_scope_unit: 25
  answer_moments_per_activity: { min: 3, max: 8 }
  stages:
    - { stage: 1, range: [1, 5],   label: "opmerken en receptief onderscheiden" }
    - { stage: 2, range: [6, 10],  label: "betekenis koppelen, receptief naar gecontroleerd" }
    - { stage: 3, range: [11, 15], label: "gecontroleerd schrijven van correcte vormen" }
    - { stage: 4, range: [16, 20], label: "geleid schrijven in context" }
    - { stage: 5, range: [21, 25], label: "productieve transfer, revisie, persoonlijke toepassing" }

  quotas:
    grammar_topic:
      min_typed_answer_activities: 18
      max_multiple_choice_activities: 5
      min_error_repair_activities: 3
      min_transformation_activities: 3
      min_mini_writing_activities: 2
      min_distinct_interaction_types: 12
      max_uses_per_interaction_type: 3
    vocabulary_set:
      min_typed_answer_activities: 15
      max_multiple_choice_activities: 6
      min_collocation_activities: 3
      min_word_family_activities: 2
      min_register_context_activities: 2
      min_mini_writing_activities: 2
      min_distinct_interaction_types: 12
      max_uses_per_interaction_type: 3

  answer_checking:
    normalize_typographic_apostrophes: true
    collapse_repeated_whitespace: true
    trim_outer_whitespace: true
    ignore_case_by_default: false     # alleen per activiteit expliciet toestaan
    ignore_terminal_punctuation_by_default: false
    accept_spelling_errors: false
    accept_wrong_inflection: false
    max_hints: 3
    reveal_model_answer_after_attempts: 3

# ---------------------------------------------------------------------------
# Reading en listening
# ---------------------------------------------------------------------------
modules:
  # Twee onderwerpen, elk op twee niveaus. Dat geeft echte differentiatie:
  # dezelfde inhoud, dezelfde les, twee moeilijkheidsgraden naast elkaar.
  topics_per_theme: 2
  readings_per_theme: 4
  listenings_per_theme: 4
  variants: ["core", "challenge"]

audio:
  mode: "scripts_and_ssml"           # geen TTS-provider geconfigureerd
  browser_speech_synthesis_fallback: true
  build_real_audio: false
  status_when_not_built: "not_built"
  forbid_voice_cloning: true

# ---------------------------------------------------------------------------
# Presentaties
# ---------------------------------------------------------------------------
pptx:
  mode: "hybrid_classroom_16x9"
  page_faithful_portrait_enabled: false   # geblokkeerd door rights.status
  slide_width_inch: 13.333
  slide_height_inch: 7.5
  min_body_font_pt: 18
  student_deck: true
  teacher_deck: true
  combined_book_deck: false
  source_refs_location: "speaker_notes"

  # Correctiedeck bij de oefeningen van het boek.
  answer_deck:
    enabled: true
    reveal: "progressive"        # progressive | per_exercise
    max_items_per_slide: 8
    footer_nl: "Leerkrachtmateriaal — eigen lesgroepen"

# ---------------------------------------------------------------------------
# Web
# ---------------------------------------------------------------------------
web:
  student_mode: true
  teacher_mode: true
  progress_storage: "localStorage"
  allow_analytics: false
  require_network_for_core: false
  single_file_export_per_theme: true

accessibility:
  wcag_level: "AA"
  color_never_sole_carrier: true
  respect_prefers_reduced_motion: true
  keyboard_navigable: true

# ---------------------------------------------------------------------------
# Proces
# ---------------------------------------------------------------------------
pilot:
  book_id: ace3
  theme_id: ace3-u1
  confirmed: true
  note: >
    De gebruiker bevestigt dat ace3-u1 een volwaardige unit is, geen
    instap- of herhalingsunit. De terugvaloptie ace3-u4 is niet meer nodig.

batching:
  transaction_size: "theme"
  publish_to_dist_requires_green_qa: true
