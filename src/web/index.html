<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>New Ace 3 &amp; New Strike 3 — practice</title>
    <meta
      name="description"
      content="Practice environment with grammar, vocabulary, reading and listening for New Ace 3 and New Strike 3."
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to main content</a>

    <header class="app-header">
      <div class="app-header__brand">
        <h1>Practice</h1>
        <p class="app-header__subtitle">New Ace 3 &amp; New Strike 3</p>
      </div>

      <div class="app-header__controls">
        <div class="mode-switch" role="group" aria-label="View mode">
          <button type="button" data-mode="student" class="is-active" aria-pressed="true">
            Student
          </button>
          <button type="button" data-mode="teacher" aria-pressed="false">Teacher</button>
        </div>
        <button type="button" id="export-progress" class="btn btn--ghost">
          Export progress
        </button>
        <label class="btn btn--ghost" for="import-progress">
          Import progress
          <input type="file" id="import-progress" accept="application/json" hidden />
        </label>
        <button type="button" id="reset-progress" class="btn btn--ghost">Erase progress</button>
      </div>
    </header>

    <div class="app-body">
      <nav class="sidebar" aria-label="Contents">
        <div class="filters">
          <label for="filter-kind">Section</label>
          <select id="filter-kind">
            <option value="all">All</option>
            <option value="grammar_topic">Grammar</option>
            <option value="vocabulary_set">Vocabulary</option>
            <option value="reading">Reading</option>
            <option value="listening">Listening</option>
          </select>

          <label for="filter-status">Status</label>
          <select id="filter-status">
            <option value="all">All</option>
            <option value="todo">To do</option>
            <option value="started">In progress</option>
            <option value="done">Done</option>
          </select>
        </div>

        <div id="nav-tree" class="nav-tree"></div>
      </nav>

      <main id="main" class="main" tabindex="-1">
        <div id="view"></div>
      </main>
    </div>

    <div id="live-region" class="visually-hidden" role="status" aria-live="polite"></div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
